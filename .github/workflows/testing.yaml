# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: 'Test GitHub Action 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    paths:
      - '**'
      - '!.github/**'
      - '!.*'
      - '!tox.ini'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  test-basic:
    name: 'Test Basic Functionality'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        name: 'Harden runner'
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Test Action with auto-detection'
        id: test-auto
        uses: ./

      - name: 'Verify auto-detection output'
        shell: bash
        run: |
          # Verify the scorecard URL was generated
          url="${STEPS_TEST_AUTO_OUTPUTS_SCORECARD_URL}"
          echo "Generated URL: ${url}"

          if [[ -z "${url}" ]]; then
            echo 'Error: no URL generated' >&2
            exit 1
          fi

          if [[ "${url}" != *'scorecard.dev/viewer'* ]]; then
            echo 'Error: invalid URL format' >&2
            exit 1
          fi

          echo '✅ Auto-detection test passed'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_AUTO_OUTPUTS_SCORECARD_URL: ${{ steps.test-auto.outputs.scorecard_url }}

  test-with-inputs:
    name: 'Test with Custom Inputs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        name: 'Harden runner'
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Test Action with custom inputs'
        id: test-custom
        uses: ./
        with:
          repository_owner: 'testowner'
          repository_name: 'testrepo'

      - name: 'Verify previous step results'
        shell: bash
        run: |
          # Verify the scorecard URL contains custom values

          # Note: Contents of GITHUB_STEP_SUMMARY file is managed by GitHub
          # and cannot be reliably read or checked/verified across steps.

          url="${STEPS_TEST_CUSTOM_OUTPUTS_SCORECARD_URL}"
          echo "Generated URL: ${url}"
          expected_url='https://scorecard.dev/viewer/?uri=github.com/testowner/testrepo'
          if [[ "${url}" != "${expected_url}" ]]; then
            echo "Error: expected '${expected_url}', got '${url}'" >&2
            exit 1
          fi
          echo '✅ Custom inputs test passed'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_CUSTOM_OUTPUTS_SCORECARD_URL: ${{ steps.test-custom.outputs.scorecard_url }}


  # The step summary functionality is verified by visual inspection in the
  # GitHub Actions UI where summaries appear correctly for all test jobs.
  # See: test-basic, test-with-inputs, and test-edge-cases jobs which all
  # successfully generate step summaries visible in the workflow run UI.

  test-edge-cases:
    name: 'Test Edge Cases'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        name: 'Harden runner'
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Test with empty inputs'
        id: test-empty
        uses: ./
        with:
          repository_owner: ''
          repository_name: ''

      - name: 'Verify empty inputs fallback to auto-detection'
        shell: bash
        run: |
          # Verify that empty inputs fall back to auto-detection
          url="${STEPS_TEST_EMPTY_OUTPUTS_SCORECARD_URL}"
          echo "Generated URL: ${url}"

          if [[ -z "${url}" ]]; then
            echo 'Error: no URL generated with empty inputs' >&2
            exit 1
          fi

          # Should contain the actual repository name from auto-detection
          if [[ "${url}" != *'scorecard.dev/viewer'* ]]; then
            echo 'Error: invalid URL format with empty inputs' >&2
            exit 1
          fi

          echo '✅ Empty inputs test passed'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_EMPTY_OUTPUTS_SCORECARD_URL: ${{ steps.test-empty.outputs.scorecard_url }}

      - name: 'Test with only owner specified'
        id: test-partial
        uses: ./
        with:
          repository_owner: 'partialtest'
          repository_name: ''

      - name: 'Verify partial inputs'
        shell: bash
        run: |
          # Verify partial inputs
          url="${STEPS_TEST_PARTIAL_OUTPUTS_SCORECARD_URL}"
          echo "Generated URL: ${url}"

          if [[ -z "${url}" ]]; then
            echo 'Error: no URL generated with partial inputs' >&2
            exit 1
          fi

          echo '✅ Partial inputs test passed'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_PARTIAL_OUTPUTS_SCORECARD_URL: ${{ steps.test-partial.outputs.scorecard_url }}
